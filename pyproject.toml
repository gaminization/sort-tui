[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sort-tui"
version = "0.1.2"
description = "Terminal visualiser for sorting algorithms"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "sortui contributors", email = "sortui@example.com"}]
keywords = ["sorting", "algorithms", "terminal", "tui", "visualiser", "curses", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Terminals",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pre-commit", "ruff", "mypy", "build"]

[project.scripts]
sortui = "sortui.__main__:main"
sort-tui = "sortui.__main__:main"

[project.urls]
Homepage = "https://github.com/gaminization/sort-tui"
Repository = "https://github.com/gaminization/sort-tui"
Issues = "https://github.com/gaminization/sort-tui/issues"
Changelog = "https://github.com/gaminization/sort-tui/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["sortui*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "F401", "F821", "F841", "E402", "I001", "W293", "F811", "E401", "E741", "E711"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disable_error_code = ["var-annotated", "union-attr", "call-overload", "attr-defined", "arg-type", "assignment"]
